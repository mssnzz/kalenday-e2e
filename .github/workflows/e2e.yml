name: e2e

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Production monitoring: every weekday at 12:07 UTC (08:07 in Santo Domingo).
    - cron: "7 12 * * 1-5"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
